<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>AI 中转站价格管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">离线个人工具</p>
        <h1>AI 中转站价格管理</h1>
      </div>
      <button class="icon-button" data-action="toggle-theme" aria-label="切换主题" title="切换主题">◐</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>首页</small></button>
      <button data-view="ranking" class="nav-item"><span>↕</span><small>价格排行</small></button>
      <button data-view="calculator" class="nav-item"><span>∑</span><small>费用计算</small></button>
      <button data-view="usage" class="nav-item"><span>▤</span><small>使用记录</small></button>
      <button data-view="settings" class="nav-item"><span>⚙</span><small>设置</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <dialog id="editor-dialog"></dialog>
  <script src="app.js" type="module"></script>
</body>
</html>
