name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 云端构建：不依赖本机 npm / JDK / Android SDK。
# android/ 不提交到仓库，由 CI 在检出后通过 npx cap add android 重新生成。
# 注意：Capacitor 不允许 webDir 为 "."（项目根），因此这里把 web 资源准备到 www/ 子目录。
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装前端依赖
        run: npm install

      - name: 准备 Web 资源目录 www/
        run: |
          mkdir -p www
          cp index.html app.js core.js styles.css www/
          echo "www/ 内容:"; ls -l www

      - name: 添加 Capacitor Android 平台（已存在则跳过，保证幂等）
        run: test -d android || npx cap add android

      - name: 同步 Web 资源到 Android（生成 capacitor.plugins.json 等）
        run: npx cap sync android

      - name: 配置 Android SDK 并接受许可
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -euo pipefail
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools"
          echo "下载 command-line tools ..."
          curl -fsSL --retry 3 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          set +e
          yes | sdkmanager --sdk_root="$SDK" --licenses
          SDKMANAGER_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$SDKMANAGER_STATUS" -ne 0 ]; then
            exit "$SDKMANAGER_STATUS"
          fi

          # 从 npx cap add 生成的工程读取真实 compileSdk / targetSdk / buildToolsVersion
          # （不假设具体 API 级别，也不依赖 Capacitor 默认值）
          BUILD_GRADLE="$PWD/android/app/build.gradle"
          VARIABLES_GRADLE="$PWD/android/variables.gradle"
          if [ ! -f "$BUILD_GRADLE" ]; then
            echo "::error::未找到 $BUILD_GRADLE，无法确认所需 SDK 版本"
            exit 1
          fi
          API=$(sed -nE "s/^[[:space:]]*compileSdk[[:space:]]*(=|[[:space:]])[[:space:]]*[\"']?([0-9]+).*/\2/p" "$BUILD_GRADLE" | head -n1 || true)
          TARGET=$(sed -nE "s/^[[:space:]]*targetSdkVersion[[:space:]]*(=|[[:space:]])[[:space:]]*[\"']?([0-9]+).*/\2/p" "$BUILD_GRADLE" | head -n1 || true)
          BT=$(sed -nE "s/^[[:space:]]*buildToolsVersion[[:space:]]*(=|[[:space:]])[[:space:]]*[\"']?([0-9]+\.[0-9]+\.[0-9]+).*/\2/p" "$BUILD_GRADLE" | head -n1 || true)
          if [ -f "$VARIABLES_GRADLE" ]; then
            [ -z "$API" ] && API=$(sed -nE "s/^[[:space:]]*compileSdkVersion[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p" "$VARIABLES_GRADLE" | head -n1 || true)
            [ -z "$TARGET" ] && TARGET=$(sed -nE "s/^[[:space:]]*targetSdkVersion[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p" "$VARIABLES_GRADLE" | head -n1 || true)
            [ -z "$BT" ] && BT=$(sed -nE "s/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\1/p" "$VARIABLES_GRADLE" | head -n1 || true)
          fi
          if [ -z "$API" ]; then
            echo "::error::无法从 $BUILD_GRADLE 或 $VARIABLES_GRADLE 解析 compileSdk/compileSdkVersion"
            exit 1
          fi
          echo "检测到 compileSdk/targetSdk=$API, buildToolsVersion=${BT:-Gradle/AGP 默认}"
          SDK_PACKAGES=("platform-tools" "platforms;android-${API}")
          [ -n "$BT" ] && SDK_PACKAGES+=("build-tools;${BT}")
          sdkmanager --sdk_root="$SDK" "${SDK_PACKAGES[@]}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK（无需签名）
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
