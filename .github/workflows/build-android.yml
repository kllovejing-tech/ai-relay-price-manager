name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 云端构建：不依赖本机 npm / JDK / Android SDK。
# android/ 不提交到仓库，由 CI 在检出后通过 npx cap add android 重新生成。
# 注意：Capacitor 不允许 webDir 为 "."（项目根），因此这里把 web 资源准备到 www/ 子目录。
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装前端依赖
        run: npm install

      - name: 准备 Web 资源目录 www/
        run: |
          mkdir -p www
          cp index.html app.js core.js styles.css www/
          echo "www/ 内容:"; ls -l www

      - name: 添加 Capacitor Android 平台（已存在则跳过，保证幂等）
        run: test -d android || npx cap add android

      - name: 同步 Web 资源到 Android（生成 capacitor.plugins.json 等）
        run: npx cap sync android

      - name: 配置 Android SDK 并接受许可
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK（无需签名）
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
